# Alternativa com disco: serviço pago. Escolha conscientemente no Render.
services:
  - type: web
    name: fraude-lab
    runtime: node
    plan: starter
    buildCommand: node --check server.js
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ADMIN_USER
        value: professora
      - key: ADMIN_PASSWORD
        sync: false
      - key: STATE_DIR
        value: /var/data/fraude-lab
    disk:
      name: estado-hackathon
      mountPath: /var/data
      sizeGB: 1
